services:
  limita-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: limita-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - limita-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  limita-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: limita-api
    depends_on:
      limita-db:
        condition: service_healthy
    ports:
      - "5211:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=limita-db,1433;Database=LimitaDb;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-LimitaBankingSystemSuperSecureSecretKey2026!@#$%^}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  limita-db-data: